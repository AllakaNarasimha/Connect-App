trigger:
  branches:
    include:
      - master
      - release/*

resources:
  repositories:
    - repository: templates
      type: git
      name: Pipeline-Templates/Pipeline-Templates
      ref: refs/heads/test/angular-pnpm-template-update
      endpoint: Pipeline-Templates-Connection

variables:
  - name: sourceBranchShort
    value: $(Build.SourceBranchName)

  - name: sourceVersionMessage
    value: $(Build.SourceVersionMessage)

stages:
- template: master-deploy.yml@templates
  parameters:
    # ============================================================
    # APPLICATION
    # ============================================================

    techStack: 'angular-pnpm'
    appName: 'Connect-App'

    # ============================================================
    # NX / PNPM
    # ============================================================

    nxProject: 'connect-app'
    pnpmVersion: '10.23.0'
    nodeVersion: '20.x'

    # ============================================================
    # SOURCE
    # ============================================================

    sourceBranch: '$(Build.SourceBranch)'
    sourceBranchShort: '$(sourceBranchShort)'
    sourceVersionMessage: '$(sourceVersionMessage)'

    # ============================================================
    # DEV DEPLOYMENT
    #
    # TEMPORARY:
    # Allows test/pipeline-template-validation to deploy to Dev.
    # Change back to false after validation.
    # ============================================================

    allowNonMasterDeploy: true

    devEnvironmentName: 'Development'

    devVariableGroup: 'Connect-App-Deployment'
    devStaticWebAppTokenVariable: 'STATIC_WEB_APP_DEV_TOKEN'
    devStaticWebAppEnvironment: 'dev'

    # ============================================================
    # PRODUCTION
    #
    # Production remains protected by the release/* condition
    # inside prod-template.yml.
    # ============================================================

    prodEnvironmentName: 'Production'